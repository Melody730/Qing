<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F4F8FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111820" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20rx='16'%20fill='%23EBF3FA'/%3E%3Cpath%20d='M47%2015c-18%202-27%2012-25%2030%2015%202%2026-9%2025-30Z'%20fill='%237FAFCB'/%3E%3Cpath%20d='M22%2045c6-12%2013-19%2022-25'%20fill='none'%20stroke='%232C5C78'%20stroke-width='3'%20stroke-linecap='round'/%3E%3C/svg%3E">
<title>清子的小账本</title>
<style>
*,*::before,*::after{box-sizing:border-box}
/* 【重要】下面这条不能删：.fld 用了 display:inline-flex，
   会盖掉浏览器默认的 [hidden]{display:none}，导致 hidden 属性失效 */
[hidden]{display:none!important}

/* ============ 雾蓝 · 浅色 ============ */
:root{
  color-scheme:light;
  --paper:#F4F8FB;
  --sky-1:#FAFCFE;
  --sky-2:#EFF7FC;
  --sky-3:#E8F3FB;
  --sky-4:#F6FAFD;
  --glow:rgba(255,255,255,.55);
  --dot:rgba(108,148,178,.13);
  --card:#FFFFFF;
  --panel:#F1F6FA;
  --panel-2:#F7FAFD;
  --ink:#2A3A45;
  --ink2:#6A7D8A;
  --ink3:#9FB0BC;
  --line:#E0EAF2;
  --line-strong:#CADBE7;
  --blue:#7FAFCB;
  --blue-deep:#457A99;
  --blue-ink:#2C5C78;
  --blue-soft:#EBF3FA;
  --blue-line:#C9DFEE;
  --blue-shadow:#36627D;
  --aqua:#9CC9D0;
  --aqua-ink:#417A83;
  --aqua-soft:#EDF7F8;
  --aqua-line:#D0E8EA;
  --iris:#BCB9DE;
  --iris-ink:#5F5C93;
  --iris-soft:#F3F2FB;
  --iris-line:#DFDDEF;
  --danger:#BE6258;
  --danger-ink:#A94D43;
  --danger-soft:#FCF1EF;
  --danger-line:#F3D6D2;
  --on-accent:#FFFFFF;
  --wash-a:rgba(198,222,238,.50);
  --wash-b:rgba(205,209,238,.35);
  --wash-c:rgba(206,233,235,.28);
  --shadow:0 24px 44px -32px rgba(38,72,96,.42);
  --shadow-sm:0 12px 24px -20px rgba(38,72,96,.38);
  --ring:0 0 0 4px rgba(127,175,203,.18);
  --r:24px;
  --r-sm:16px;
}

/* ============ 雾蓝 · 深色（夜间模式） ============ */
@media (prefers-color-scheme:dark){
  :root{
    color-scheme:dark;
    --paper:#111820;
    --sky-1:#131C25;
    --sky-2:#0F171F;
    --sky-3:#0D141B;
    --sky-4:#111A22;
    --glow:rgba(126,178,212,.14);
    --dot:rgba(150,185,205,.07);
    --card:#1A242D;
    --panel:#212D37;
    --panel-2:#1E2933;
    --ink:#E8F0F6;
    --ink2:#A2B3BF;
    --ink3:#748E9D;
    --line:#293845;
    --line-strong:#394B5A;
    --blue:#7FB2D2;
    --blue-deep:#8FC5E2;
    --blue-ink:#A9D6EC;
    --blue-soft:#1F2E3A;
    --blue-line:#334C5E;
    --blue-shadow:#223D50;
    --aqua:#93C8D0;
    --aqua-ink:#A5DDE4;
    --aqua-soft:#1B2D32;
    --aqua-line:#2C464B;
    --iris:#B9B7DD;
    --iris-ink:#CFCDF0;
    --iris-soft:#25253A;
    --iris-line:#3A3956;
    --danger:#D8766B;
    --danger-ink:#FFA79C;
    --danger-soft:#33211F;
    --danger-line:#55332F;
    --on-accent:#0F1E2A;
    --wash-a:rgba(58,92,118,.24);
    --wash-b:rgba(60,62,108,.20);
    --wash-c:rgba(48,98,102,.14);
    --shadow:0 22px 44px -30px rgba(0,0,0,.85);
    --shadow-sm:0 12px 26px -20px rgba(0,0,0,.8);
    --ring:0 0 0 4px rgba(127,178,210,.17);
  }
}

body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",sans-serif;
  font-size:14px;
  line-height:1.6;
  color:var(--ink);
  background-color:var(--paper);
  padding:clamp(20px,3.4vw,44px) 16px calc(26px + env(safe-area-inset-bottom));
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
::selection{background:rgba(127,175,203,.25)}

button{font:inherit;touch-action:manipulation}
input,button{font-family:inherit}
button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input:focus-visible{outline:none}

.wrap{max-width:940px;margin:0 auto;position:relative;z-index:1}

/* ---------- 背景：薄雾海面 ---------- */
.bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;pointer-events:none;
  background:
    radial-gradient(46vw 34vw at 6% -6%,var(--wash-a),transparent 70%),
    radial-gradient(42vw 30vw at 96% 0%,var(--wash-b),transparent 72%),
    radial-gradient(var(--dot) 1.1px,transparent 1.2px) 0 0/30px 30px,
    linear-gradient(180deg,var(--sky-1) 0%,var(--sky-2) 42%,var(--sky-3) 72%,var(--sky-4) 100%);
}
.bg::after{
  content:"";position:absolute;left:50%;top:-170px;
  width:560px;height:560px;max-width:90vw;max-height:90vw;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 68%);
  opacity:.65;
}
.mist{
  position:absolute;border-radius:50%;
  will-change:transform;
}
.m1{
  width:60vw;height:40vw;left:-20vw;top:-16vw;
  background:radial-gradient(closest-side,rgba(176,211,236,.48),rgba(176,211,236,0) 72%);
  animation:mistA 36s ease-in-out infinite alternate;
}
.m2{
  width:52vw;height:36vw;right:-18vw;top:-12vw;
  background:radial-gradient(closest-side,rgba(197,200,237,.40),rgba(197,200,237,0) 72%);
  animation:mistB 44s ease-in-out infinite alternate;
}
.m3{
  width:48vw;height:32vw;left:20vw;bottom:-20vw;
  background:radial-gradient(closest-side,rgba(178,222,229,.34),rgba(178,222,229,0) 74%);
  animation:mistC 50s ease-in-out infinite alternate;
}
@keyframes mistA{from{transform:translate3d(0,0,0)}to{transform:translate3d(4vw,2vw,0)}}
@keyframes mistB{from{transform:translate3d(0,0,0)}to{transform:translate3d(-3vw,2.5vw,0)}}
@keyframes mistC{from{transform:translate3d(0,0,0)}to{transform:translate3d(3vw,-2vw,0)}}

.bubble{
  position:absolute;border-radius:50%;
  border:1px solid rgba(126,172,203,.30);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),rgba(255,255,255,.16) 38%,rgba(184,218,240,.10) 70%,transparent 72%);
  box-shadow:inset 0 0 10px rgba(255,255,255,.55);
  opacity:.6;
  animation:bubbleFloat var(--t,26s) ease-in-out infinite alternate;
}
.b1{width:34px;height:34px;left:6%;top:24%;--t:26s}
.b2{width:17px;height:17px;left:14%;top:62%;--t:32s;animation-delay:-9s}
.b3{width:46px;height:46px;right:7%;top:34%;--t:36s;animation-delay:-15s}
.b4{width:12px;height:12px;right:20%;top:14%;--t:22s;animation-delay:-5s}
.b5{width:26px;height:26px;left:31%;top:76%;--t:30s;animation-delay:-19s}
.b6{width:15px;height:15px;right:29%;top:66%;--t:27s;animation-delay:-11s}
@keyframes bubbleFloat{
  from{transform:translate3d(0,0,0)}
  to{transform:translate3d(6px,-24px,0)}
}

.waves{
  position:absolute;left:0;right:0;bottom:0;
  width:100%;height:min(34vh,320px);
  opacity:.9;
}
.waves .wf1{fill:rgba(170,207,233,.34)}
.waves .wf2{fill:rgba(196,221,240,.30)}
.waves .wl{fill:none;stroke:rgba(122,167,200,.30);stroke-width:1.2;vector-effect:non-scaling-stroke}
.waves .wl2{stroke-opacity:.55}

@media (prefers-color-scheme:dark){
  .m1{background:radial-gradient(closest-side,rgba(46,86,116,.38),rgba(46,86,116,0) 72%)}
  .m2{background:radial-gradient(closest-side,rgba(58,58,105,.30),rgba(58,58,105,0) 72%)}
  .m3{background:radial-gradient(closest-side,rgba(42,92,98,.24),rgba(42,92,98,0) 74%)}
  .bubble{
    border-color:rgba(140,190,220,.18);
    background:radial-gradient(circle at 32% 28%,rgba(210,235,250,.35),rgba(140,190,220,.05) 45%,transparent 70%);
    box-shadow:inset 0 0 10px rgba(160,210,240,.15);
    opacity:.5;
  }
  .waves .wf1{fill:rgba(80,130,165,.20)}
  .waves .wf2{fill:rgba(100,150,185,.16)}
  .waves .wl{stroke:rgba(140,190,220,.20)}
}

/* ---------- 顶部名牌 ---------- */
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 20px}
.brand-tag{
  display:inline-flex;align-items:center;gap:7px;
  padding:6px 14px 7px 12px;
  font-size:11.5px;font-weight:800;
  letter-spacing:1.6px;
  color:var(--blue-ink);
  background:var(--card);
  border:1px solid var(--blue-line);
  border-radius:999px;
  box-shadow:var(--shadow-sm);
}
.brand-tag svg{width:14px;height:14px;flex:0 0 auto;color:var(--blue)}
.brand-side{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 2px;
  font-size:11.5px;font-weight:600;letter-spacing:.9px;color:var(--ink2);
}
.brand-side svg{width:14px;height:14px;flex:0 0 auto;color:var(--iris)}

/* ---------- 页头 ---------- */
header{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.mascot-wrap{position:relative;flex:0 0 auto;width:94px;height:94px}
.mascot-wrap::before{
  content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from 200deg,var(--blue-line),var(--aqua-line),var(--iris-line),var(--blue-line));
  filter:blur(8px);opacity:.72;
}
.mascot{
  position:relative;display:block;
  width:100%;height:100%;
  object-fit:cover;object-position:50% 30%;border-radius:50%;
  border:3px solid var(--card);
  box-shadow:0 0 0 1px var(--blue-line),0 16px 28px -18px rgba(38,72,96,.6);
  animation:bob 6.5s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.leaf-badge{
  position:absolute;right:-2px;bottom:0;z-index:1;
  width:30px;height:30px;display:grid;place-items:center;
  color:var(--blue-deep);
  background:var(--card);
  border:1px solid var(--blue-line);border-radius:50%;
  box-shadow:var(--shadow-sm);
}
.leaf-badge svg{width:15px;height:15px}

.head-text{min-width:0}
h1{
  margin:0 0 5px;
  font-family:"Microsoft YaHei UI","PingFang SC","Hiragino Sans GB",system-ui,sans-serif;
  font-size:clamp(22px,3.6vw,30px);
  line-height:1.3;
  font-weight:800;
  letter-spacing:.4px;
}
.name-en{
  font-family:Georgia,"Times New Roman",serif;
  font-style:italic;font-weight:400;
  font-size:1.08em;letter-spacing:0;
  color:var(--blue-deep);margin-right:2px;
}
h1 .hl{position:relative;display:inline-block}
h1 .hl::after{
  content:"";position:absolute;left:-3px;right:-3px;bottom:3px;height:8px;z-index:-1;
  border-radius:4px;
  background:linear-gradient(90deg,rgba(127,175,203,.30),rgba(188,185,222,.24));
}
.sub{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  margin:0;font-size:12.5px;font-weight:600;letter-spacing:.4px;color:var(--ink2);
}
.sub svg{width:12px;height:12px;flex:0 0 auto;color:var(--blue)}

/* ---------- 小贴士 ---------- */
.hint{
  display:flex;align-items:flex-start;gap:11px;
  padding:12px 16px;margin:0 0 20px;
  font-size:12.5px;line-height:1.75;color:var(--ink2);
  text-wrap:pretty;
  background:var(--blue-soft);
  border:1px solid var(--blue-line);
  border-left:3px solid var(--blue);
  border-radius:14px;
}
.hint-ic{
  flex:0 0 auto;width:26px;height:26px;margin-top:1px;
  display:grid;place-items:center;
  color:var(--blue-deep);background:var(--card);
  border:1px solid var(--blue-line);border-radius:50%;
}
.hint-ic svg{width:14px;height:14px}
.hint b{color:var(--blue-ink);font-weight:800}
.hint kbd{
  padding:1px 6px;font-family:inherit;font-size:11px;font-weight:800;
  color:var(--blue-ink);background:var(--card);
  border:1px solid var(--blue-line);border-radius:5px;
  box-shadow:0 1px 0 var(--blue-line);
}

/* ---------- 卡片列表 ---------- */
.list{display:flex;flex-direction:column;gap:14px}

.row{
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) 208px;
  gap:14px 20px;
  padding:18px 20px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--r);
  box-shadow:var(--shadow-sm);
  transition:box-shadow .2s,transform .2s,opacity .2s,border-color .2s;
}
@media (hover:hover){
  .row:hover{transform:translateY(-1px);border-color:var(--line-strong);box-shadow:var(--shadow)}
}
.row:focus-within{border-color:var(--blue-line);box-shadow:var(--shadow),var(--ring)}
.row-main{min-width:0;display:flex;flex-direction:column;gap:12px}

.row-top{display:flex;align-items:center;gap:8px}
.badge{
  width:30px;height:30px;flex:0 0 auto;
  display:grid;place-items:center;
  border-radius:9px;
  font-size:11px;font-weight:800;letter-spacing:.4px;
  font-variant-numeric:tabular-nums;
  color:var(--blue-ink);background:var(--blue-soft);
  border:1px solid var(--blue-line);
}
.row:nth-child(3n+2) .badge{color:var(--iris-ink);background:var(--iris-soft);border-color:var(--iris-line)}
.row:nth-child(3n) .badge{color:var(--aqua-ink);background:var(--aqua-soft);border-color:var(--aqua-line)}

/* ---------- 输入控件 ---------- */
.inp{
  width:100%;min-width:0;
  padding:9px 11px;
  font-size:14px;color:var(--ink);
  background:var(--panel);
  border:1px solid transparent;
  border-radius:11px;
  font-variant-numeric:tabular-nums;
  transition:border-color .15s,box-shadow .15s,background .15s;
}
.inp:hover{background:var(--panel-2);border-color:var(--line)}
.inp:focus{outline:none;background:var(--card);border-color:var(--blue);box-shadow:var(--ring)}
.inp::placeholder{color:var(--ink3)}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.38;cursor:pointer}
input[type=time]::-webkit-calendar-picker-indicator:hover{opacity:.8}

.name{
  flex:1 1 auto;
  padding:6px 2px;
  font-size:15.5px;font-weight:700;
  background:transparent;border:0;border-bottom:1px dashed var(--line-strong);
  border-radius:0;
}
.name:hover{background:transparent;border-color:var(--blue)}
.name:focus{background:transparent;border-bottom:1px solid var(--blue);box-shadow:none}

.icon-btn{
  width:32px;height:32px;flex:0 0 auto;
  display:grid;place-items:center;
  color:var(--ink3);background:transparent;
  border:1px solid transparent;border-radius:9px;
  cursor:pointer;transition:.16s;
}
.dup:hover{color:var(--blue-ink);background:var(--blue-soft);border-color:var(--blue-line)}
.del{margin-left:1px}
.del:hover{color:var(--danger-ink);background:var(--danger-soft);border-color:var(--danger-line)}

.row-ctrl{display:flex;flex-wrap:wrap;align-items:flex-start;gap:11px 14px}
.row-ctrl-2{display:flex;flex-wrap:wrap;align-items:flex-start;gap:11px 14px;flex:1 1 100%;min-width:0}
.fld{display:inline-flex;align-items:center;gap:6px;min-width:0}
.lbl{flex:0 0 auto;font-size:12.5px;color:var(--ink2);font-weight:700}
.unit{flex:0 0 auto;font-size:12px;color:var(--ink3)}
.tilde{color:var(--blue);font-size:13px;font-weight:800}

.t-start,.t-end{width:112px}
.h-val,.deduct{width:68px;text-align:center;font-weight:700}
.rate{width:84px;font-weight:700}
.fld-note{flex:1 1 150px}
.notev{min-width:110px}

/* ---------- 单人多时段 ---------- */
.range-only{align-items:flex-start}
.range-only>.lbl{margin-top:9px}
.seg-stack{display:flex;flex-direction:column;gap:5px;min-width:0}
.seg-list{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg-row{display:flex;align-items:center;gap:5px;min-width:0}
.seg-x{
  width:24px;height:24px;flex:0 0 auto;
  display:grid;place-items:center;
  font-size:15px;line-height:1;color:var(--ink3);
  background:transparent;border:1px solid transparent;border-radius:7px;
  cursor:pointer;transition:.15s;
}
.seg-x:hover{color:var(--danger-ink);background:var(--danger-soft);border-color:var(--danger-line)}
.seg-add{
  align-self:flex-start;
  display:inline-flex;align-items:center;gap:4px;
  padding:3px 9px;
  font-size:11.5px;font-weight:700;color:var(--blue-ink);
  background:transparent;border:1px dashed var(--blue-line);border-radius:999px;
  cursor:pointer;transition:.15s;
}
.seg-add:hover{background:var(--blue-soft);border-color:var(--blue)}
.seg-add svg{flex:0 0 auto}

/* ---------- 计费方式切换 ---------- */
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px}
.seg-btn{
  padding:5px 13px;
  font-size:12.5px;font-weight:700;color:var(--ink2);
  background:transparent;border:0;border-radius:999px;
  cursor:pointer;transition:.16s;white-space:nowrap;
}
.seg-btn:hover{color:var(--blue-ink)}
.seg-btn.on{
  color:var(--blue-ink);
  background:var(--card);
  box-shadow:0 1px 3px rgba(38,72,96,.12),0 0 0 1px var(--blue-line);
}

/* ---------- 时长加减 ---------- */
.step{display:inline-flex;align-items:center;gap:5px}
.mini{
  width:28px;height:28px;flex:0 0 auto;
  display:grid;place-items:center;
  font-size:16px;font-weight:700;line-height:1;color:var(--blue-deep);
  background:var(--card);border:1px solid var(--blue-line);border-radius:8px;
  cursor:pointer;transition:.12s;
}
.mini:hover{background:var(--blue-soft)}
.mini:active{transform:translateY(1px)}

/* ---------- 单行结果（小票） ---------- */
.row-out{
  position:relative;
  grid-column:2;grid-row:1;align-self:stretch;
  display:flex;flex-direction:column;justify-content:center;gap:4px;
  padding:14px 16px 13px;
  text-align:right;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:18px;
  transition:background .2s,border-color .2s,box-shadow .2s;
}
.out-spark{
  position:absolute;left:11px;top:12px;
  width:14px;height:14px;color:var(--blue);
  opacity:.32;transition:opacity .2s;
}
.row.has-val .out-spark{opacity:.8}
.out-dur{
  font-size:11.5px;font-weight:600;color:var(--ink2);
  font-variant-numeric:tabular-nums;
  padding-bottom:7px;border-bottom:1px dashed var(--line-strong);
  transition:border-color .2s;
}
.out-amt{
  font-size:27px;font-weight:800;letter-spacing:-.5px;line-height:1.2;
  color:var(--ink3);font-variant-numeric:tabular-nums;
  transform-origin:right center;
  transition:color .2s;
}
.out-amt .cur{margin-right:1px;font-size:14px;font-weight:800}
.out-amt.long{font-size:21px;letter-spacing:-.7px}
.out-amt.long .cur{font-size:12px}
.out-amt.pop{animation:pop .34s cubic-bezier(.34,1.56,.64,1)}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.row.has-val .row-out{background:var(--blue-soft);border-color:var(--blue-line)}
.row.has-val .out-dur{border-color:var(--blue-line)}
.row.has-val .out-amt{color:var(--blue-ink)}
.out-tags{display:flex;flex-wrap:wrap;gap:4px;justify-content:flex-end;margin-top:4px}
.tag{
  padding:2px 7px;border-radius:6px;white-space:nowrap;
  font-size:10.5px;font-weight:700;letter-spacing:.2px;
  background:var(--iris-soft);color:var(--iris-ink);
  border:1px solid var(--iris-line);
}
.tag.cross{background:var(--aqua-soft);color:var(--aqua-ink);border-color:var(--aqua-line)}
.tag.seg{background:var(--blue-soft);color:var(--blue-ink);border-color:var(--blue-line)}
.tag.warn{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}

/* ---------- 添加按钮 ---------- */
.add{
  display:flex;align-items:center;justify-content:center;gap:9px;
  width:100%;margin-top:14px;padding:15px;
  font-size:13.5px;font-weight:800;letter-spacing:.3px;color:var(--blue-ink);
  background:var(--card);
  border:1.5px dashed var(--blue-line);
  border-radius:var(--r);
  cursor:pointer;transition:.18s;
}
.add .plus{
  display:grid;place-items:center;
  width:24px;height:24px;flex:0 0 auto;
  color:var(--on-accent);background:var(--blue-deep);
  border-radius:50%;
  transition:transform .25s cubic-bezier(.34,1.56,.64,1);
}
.add:hover{background:var(--blue-soft);border-color:var(--blue);box-shadow:var(--shadow-sm)}
.add:hover .plus{transform:rotate(90deg)}
.add:active{transform:scale(.995)}

/* ---------- 合计 ---------- */
.summary{
  position:relative;
  display:flex;align-items:center;flex-wrap:wrap;gap:14px 20px;
  margin-top:30px;padding:20px 22px 18px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
/* 顶部一条很淡的蓝、青、紫渐变 */
.summary::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--blue),var(--aqua),var(--iris));
  opacity:.75;
}
.sumi{display:flex;flex-direction:column;gap:2px;min-width:0}
.sumi .k{font-size:10.5px;color:var(--ink3);font-weight:800;letter-spacing:1.2px}
.sumi .v{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.sumi:not(.total)+.sumi:not(.total){padding-left:20px;border-left:1px solid var(--line)}
.sumi.total{
  margin-left:auto;
  padding-left:22px;
  border-left:1px dashed var(--line-strong);
}
.sumi.total .k{color:var(--blue-ink)}
.sumi.total .v{font-size:30px;line-height:1.15;letter-spacing:-.6px;color:var(--blue-ink)}
.sumi.total .v .cur{font-size:16px;margin-right:1px}
.sum-actions{display:flex;gap:8px;margin-left:0}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 17px;white-space:nowrap;
  font-size:13px;font-weight:700;color:var(--ink);
  background:var(--card);
  border:1px solid var(--line-strong);border-radius:12px;
  box-shadow:0 1px 2px rgba(38,72,96,.06);
  cursor:pointer;transition:transform .12s,box-shadow .12s,background .15s,color .15s,border-color .15s;
}
.btn svg{flex:0 0 auto}
.btn:hover{background:var(--blue-soft);border-color:var(--blue-line);color:var(--blue-ink)}
.btn:active{transform:translateY(1px)}
.btn.primary{
  color:var(--on-accent);
  background:var(--blue-deep);
  border-color:var(--blue-deep);
  box-shadow:0 2px 6px rgba(54,98,125,.28);
}
.btn.primary:hover{background:var(--blue-shadow);border-color:var(--blue-shadow);color:var(--on-accent)}
.btn.primary:active{box-shadow:none}
.btn.armed{color:#fff;background:var(--danger);border-color:var(--danger);box-shadow:none}
.btn.armed:hover{color:#fff;background:var(--danger);border-color:var(--danger)}

/* ---------- 页脚 ---------- */
.foot{
  margin:24px 0 0;text-align:center;
  font-size:11.5px;font-weight:600;letter-spacing:1px;color:var(--ink3);
}
.foot .pw{color:var(--blue);letter-spacing:0}

/* ---------- 出错提示 ---------- */
.fatal{
  margin:14px 0 0;padding:13px 16px;
  font-size:13px;line-height:1.65;font-weight:600;
  color:var(--danger-ink);background:var(--danger-soft);
  border:1px solid var(--danger-line);border-left:3px solid var(--danger);
  border-radius:14px;
}

/* ---------- 轻提示 ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));z-index:30;
  display:flex;align-items:center;justify-content:center;gap:8px;
  max-width:calc(100vw - 32px);
  padding:11px 16px 11px 14px;
  font-size:13px;font-weight:700;
  color:var(--ink);
  background:var(--card);
  border:1px solid var(--blue-line);
  border-radius:999px;
  box-shadow:0 18px 38px -18px rgba(38,72,96,.55);
  opacity:0;pointer-events:none;
  transform:translate(-50%,14px);
  transition:opacity .24s,transform .24s;
}
.toast.show{opacity:1;pointer-events:auto;transform:translate(-50%,0)}
.toast .t-ic{width:15px;height:15px;flex:0 0 auto;color:var(--blue)}
.toast .act{
  margin-left:2px;padding:4px 10px;
  font-size:12px;font-weight:800;color:var(--blue-ink);
  background:var(--blue-soft);
  border:0;border-radius:999px;
  cursor:pointer;white-space:nowrap;
}
.toast .act:hover{background:var(--blue-line)}

/* ============ 移动端 ============ */
@media (max-width:800px){
  body{font-size:14px}
  /* 16px 字号可防止 iOS 聚焦时自动放大页面 */
  .inp,.name{font-size:16px}
  .name{font-size:16.5px}
  .inp{padding:10px 12px}
  .t-start,.t-end{width:auto}
  .h-val,.deduct{width:72px}
  .rate{width:88px}

  .bubble{display:none}
  .waves{height:min(28vh,230px)}

  .topline{margin-bottom:12px}
  .brand-tag{font-size:11px;letter-spacing:1.4px;padding:5px 12px}
  .brand-side{display:none}
  header{gap:14px;margin-bottom:16px}
  .mascot-wrap{width:82px;height:82px}
  .leaf-badge{width:26px;height:26px}
  .leaf-badge svg{width:13px;height:13px}
  h1{font-size:22px}
  .sub{font-size:12px}

  .row{grid-template-columns:minmax(0,1fr);padding:16px;gap:12px}
  .row-out{
    grid-column:1;grid-row:auto;
    flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:space-between;
    text-align:left;gap:2px 12px;
    padding:12px 16px 11px 30px;
  }
  .out-spark{top:50%;left:11px;transform:translateY(-50%)}
  .out-dur{padding-bottom:0;border-bottom:0}
  .out-tags{
    flex-basis:100%;justify-content:flex-start;margin-top:5px;
    padding-top:6px;border-top:1px dashed var(--line-strong);
  }
  .row.has-val .out-tags{border-color:var(--blue-line)}
  .out-amt{font-size:25px;transform-origin:left center}

  /* 时段两格撑满整行，避免横向溢出 */
  .range-only{width:100%}
  .range-only>.lbl{margin-top:11px}
  .range-only .seg-stack{flex:1 1 auto;min-width:0}
  .range-only .seg-row{width:100%}
  .range-only .t-start,.range-only .t-end{flex:1 1 0;width:auto;min-width:0}
  .range-only .seg-x{width:30px;height:30px;font-size:17px}
  .range-only .seg-add{padding:5px 11px;font-size:12px}
  .row-ctrl{gap:12px 14px}
  .row-ctrl-2{display:contents}

  /* 更大的点按区域 */
  .seg-btn{padding:8px 15px;font-size:13px}
  .mini{width:36px;height:36px;font-size:18px}
  .icon-btn{width:38px;height:38px}
  .badge{width:32px;height:32px}
  .btn{padding:12px 18px}
  .add{padding:16px}

  .summary{gap:12px 16px;padding:17px 16px 15px;margin-top:28px}
  .sumi:not(.total)+.sumi:not(.total){padding-left:14px}
  .sumi.total{margin-left:auto;padding-left:0;border-left:0}
  .sum-actions{width:100%;margin-left:0}
  .sum-actions .btn{flex:1}
}
@media (max-width:420px){
  body{padding-left:12px;padding-right:12px}
  .mascot-wrap{width:72px;height:72px}
  h1{font-size:20px}
  .name-en{font-size:1.02em}
  .rate{width:80px}
  .sumi .v{font-size:15px}
  .sumi.total .v{font-size:25px}
  .hint{font-size:12px;padding:11px 13px}
  .hint-ic{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

    <div class="head-text">
      <h1><span class="name-en">Qingzi</span> 的陪玩<span class="hl">小账本</span></h1>
      <p class="sub">
        把每一次陪伴，都记成清清爽爽的一笔
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C11 4.5 5.6 9.2 5 18c8.8.6 13.5-4.8 15-14Z" fill="currentColor"/></svg>
      </p>
    </div>
  </header>

  <p class="hint">
    <span class="hint-ic" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M20 4C11 4.5 5.6 9.2 5 18c8.8.6 13.5-4.8 15-14Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M5.2 17.8C8 12.8 12 9.4 17.2 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </span>
    <span>结束早于开始会<b>按跨天</b>算。「赔付」填<b>分钟</b>，会从时长和金额里一起扣。中途休息点「分段」分开算，休息不计费。昵称框按 <kbd>Enter</kbd> 可快速添一位。</span>
  </p>

  <main>
    <div class="list" id="list"></div>
    <noscript>
      <p class="fatal">这个页面需要 JavaScript 才能计算金额。请在浏览器设置里开启 JavaScript（或换用系统自带浏览器）后重新打开。</p>
    </noscript>
    <button class="add" id="addBtn" type="button">
      <span class="plus" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="14" height="14"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/></svg>
      </span>
      添加一位陪玩
    </button>
  </main>

  <section class="summary" aria-label="合计">
    <div class="sumi"><span class="k">人数</span><span class="v" id="sumCount">0 位</span></div>
    <div class="sumi"><span class="k">总时长</span><span class="v" id="sumHours">0.00 小时（0 分钟）</span></div>

      </button>
      <button class="btn" id="clearBtn" type="button">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 7h14M9.5 7V5.2A1.2 1.2 0 0 1 10.7 4h2.6a1.2 1.2 0 0 1 1.2 1.2V7M7.3 7l.9 12.1h7.6l.9-12.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

          <span class="lbl">时间</span>
          <div class="seg-stack">
            <div class="seg-list">
              <div class="seg-row">
                <input class="inp t-start" type="time" aria-label="第 1 段开始时间">
                <span class="tilde">~</span>
                <input class="inp t-end" type="time" aria-label="第 1 段结束时间">
                <button class="seg-x" type="button" title="删除这一段" aria-label="删除这一段" hidden><span aria-hidden="true">×</span></button>
              </div>
            </div>
            <button class="seg-add" type="button" title="中途休息可以分成多段计算">
              <svg viewBox="0 0 24 24" width="10" height="10" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
              分段
            </button>
          </div>
        </div>

        <div class="fld hours-only" hidden>
          <span class="lbl">时长</span>
          <span class="step">
            <button class="mini minus" type="button" aria-label="减半小时">−</button>
            <input class="inp h-val" type="number" min="0" step="0.5" inputmode="decimal" placeholder="2.5" aria-label="小时数">
            <button class="mini plus" type="button" aria-label="加半小时">+</button>
          </span>
          <span class="unit">小时</span>
        </div>

        <div class="row-ctrl-2">
          <label class="fld">
            <span class="lbl">赔付</span>
            <input class="inp deduct" type="number" min="0" step="5" inputmode="decimal" placeholder="0" aria-label="赔付减去的分钟数">
            <span class="unit">分钟</span>
          </label>

          <label class="fld">
            <span class="lbl">单价</span>
            <input class="inp rate" type="number" min="0" step="1" inputmode="decimal" placeholder="80" aria-label="每小时单价">
            <span class="unit">元/时</span>
          </label>

          <label class="fld fld-note">
            <span class="lbl">备注</span>
            <input class="inp notev" type="text" maxlength="30" placeholder="选填，如：包夜、加钟" aria-label="备注">
          </label>
        </div>
      </div>
    </div>

    <div class="row-out">
      <svg class="out-spark" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C11 4.5 5.6 9.2 5 18c8.8.6 13.5-4.8 15-14Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M5.2 17.8C8 12.8 12 9.4 17.2 7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <div class="out-dur">0.00 小时（0 分钟）</div>
      <div class="out-amt"><span class="cur">¥</span><span class="val">0.00</span></div>
      <div class="out-tags"></div>
    </div>
  </article>
</template>

<script>
(function(){
  'use strict';

  var KEY = 'qingzi-ledger-v1';
  var listEl = document.getElementById('list');
  var tpl = document.getElementById('rowTpl');

  /* ---------- 小工具 ---------- */
  function $(sel, root){ return (root || document).querySelector(sel); }
  function $$(sel, root){ return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

  function num(v, dft){
    var n = parseFloat(String(v == null ? '' : v).trim());
    return isFinite(n) ? n : (dft || 0);
  }
  function round2(n){ return Math.round((n + Number.EPSILON) * 100) / 100; }
  function group(n){                        // 1234.5 -> "1,234.50"
    var p = Math.abs(n).toFixed(2).split('.');
    return p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
  }
  function trimNum(n){ return String(Math.round(n * 100) / 100); }
  function toMin(t){                        // "18:30" -> 1110
    var m = /^(\d{1,2}):(\d{2})/.exec(t || '');
    if(!m) return null;
    var h = +m[1], mi = +m[2];
    return (h < 24 && mi < 60) ? h * 60 + mi : null;
  }
  function fmtMin(t){                       // 270 -> "4.50 小时（270 分钟）"
    t = Math.max(0, Math.round(t));         // 全程以整分钟为基准，两种形式由同一个值换算，不会对不上
    return round2(t / 60).toFixed(2) + ' 小时（' + t + ' 分钟）';
  }
  function fmtMinOnly(t){ return Math.max(0, Math.round(t)) + ' 分钟'; }

  /* ---------- 单人多时段 ---------- */
  function readSegments(row){
    return $$('.seg-row', row).map(function(seg){
      return { start: $('.t-start', seg).value, end: $('.t-end', seg).value };
    });
  }
  function syncSegRows(row){
    var segs = $$('.seg-row', row);
    segs.forEach(function(seg, i){
      var x = $('.seg-x', seg);
      if(x) x.hidden = segs.length <= 1;      // 只剩一段时不留删除键
      var a = $('.t-start', seg), b = $('.t-end', seg);
      if(a) a.setAttribute('aria-label', '第 ' + (i + 1) + ' 段开始时间');
      if(b) b.setAttribute('aria-label', '第 ' + (i + 1) + ' 段结束时间');
    });
  }
  function addSegRow(row, data){
    var list = $('.seg-list', row);
    if(!list || !list.firstElementChild) return null;
    var seg = list.firstElementChild.cloneNode(true);
    $('.t-start', seg).value = (data && data.start) || '';
    $('.t-end', seg).value = (data && data.end) || '';
    list.appendChild(seg);
    syncSegRows(row);
    return seg;
  }
  function resetSegments(row){
    var list = $('.seg-list', row);
    if(!list) return;
    $$('.seg-row', list).slice(1).forEach(function(seg){ seg.remove(); });
    var first = $('.seg-row', list);
    if(first){
      $('.t-start', first).value = '';
      $('.t-end', first).value = '';
    }
    syncSegRows(row);
  }

  /* ---------- 计算 ---------- */
  function calc(row){
    var mode = row.dataset.mode || 'range';
    var rate = Math.max(0, num($('.rate', row).value));

    var mins = 0, cross = false, warn = '', segCount = 0;

    if(mode === 'range'){
      var segs = readSegments(row);
      var partial = false, zero = false;
      segs.forEach(function(sg){
        if(!sg.start && !sg.end) return;        // 空着的新分段先不算，也不打扰
        var a = toMin(sg.start), b = toMin(sg.end);
        if(a === null || b === null){ partial = true; return; }
        var d = b - a;
        if(d < 0){ d += 1440; cross = true; }   // 每一段都单独判断跨天
        else if(d === 0){ zero = true; }
        mins += d;
        segCount++;
      });
      if(segCount === 0 || partial) warn = '待填时间';
      if(zero) warn = warn || '时段为 0';
    }else{
      mins = Math.round(Math.max(0, num($('.h-val', row).value)) * 60);   // 小时 -> 整分钟
      segCount = 1;
    }

    /* 赔付按分钟填，从这一位的时长里扣，扣到 0 为止，不会算成负数 */
    var deduct = Math.round(Math.max(0, num($('.deduct', row).value)));
    if(deduct > mins){
      deduct = mins;
      if(mins > 0) warn = warn || '赔付超额';
    }
    var netMin = mins - deduct;

    var amount = round2(netMin / 60 * rate);

    return { mode: mode, mins: mins, deduct: deduct, netMin: netMin, rate: rate, amount: amount, cross: cross, warn: warn, segCount: segCount };
  }

  /* 完全空白的一行不显示「待填时间」，页面刚打开时更清爽 */
  function isBlank(row){
    var hasTime = $$('.t-start, .t-end', row).some(function(inp){ return inp.value; });
    return !$('.name', row).value.trim() &&
           !hasTime &&
           !$('.h-val', row).value && !$('.deduct', row).value &&
           !$('.rate', row).value && !$('.notev', row).value;
  }

  function tagEl(text, cls){
    var s = document.createElement('span');
    s.className = 'tag' + (cls ? ' ' + cls : '');
    s.textContent = text;
    return s;
  }

  function paint(row, r){
    $('.out-dur', row).textContent = fmtMin(r.netMin);

    var box = $('.out-amt', row);
    var val = $('.val', box);
    var txt = group(r.amount);
    box.classList.toggle('long', txt.length >= 10);   // 金额太长时收一点字号，避免撑破小票
    if(val.textContent !== txt){
      var first = val.textContent === '0.00';
      val.textContent = txt;
      if(!first){                             // 数字变化时轻轻弹一下
        box.classList.remove('pop');
        void box.offsetWidth;
        box.classList.add('pop');
      }
    }

    var tags = $('.out-tags', row);
    tags.textContent = '';
    var blank = isBlank(row);
    if(r.warn && !blank) tags.appendChild(tagEl(r.warn, 'warn'));
    if(r.cross) tags.appendChild(tagEl('跨天', 'cross'));
    if(r.segCount > 1) tags.appendChild(tagEl('分 ' + r.segCount + ' 段', 'seg'));
    if(r.deduct > 0) tags.appendChild(tagEl('赔付 −' + fmtMinOnly(r.deduct)));

    row.classList.toggle('has-val', r.amount > 0);
  }

  /* ---------- 刷新全部 ---------- */
  function refresh(){
    var rows = $$('.row', listEl);
    var totalMin = 0, totalA = 0, totalD = 0, people = 0;

    rows.forEach(function(row, i){
      $('.badge', row).textContent = (i + 1 < 10 ? '0' : '') + (i + 1);
      var r = calc(row);
      paint(row, r);

      var named = $('.name', row).value.trim();
      if(named || r.mins > 0) people++;   // 只填了单价、还没填时长的空行不算一位

      totalMin += r.netMin;
      totalD += r.deduct;
      totalA = round2(totalA + r.amount);
    });

    $('#sumCount').textContent = people + ' 位';
    $('#sumHours').textContent = fmtMin(totalMin);
    $('#sumDeduct').textContent = fmtMinOnly(totalD);
    $('#sumDeductWrap').hidden = !(totalD > 0);   // 没有赔付时不占地方
    $('#sumAmount').textContent = group(totalA);
    save();
  }

  /* ---------- 存取 ---------- */
  function readRow(row){
    var segs = readSegments(row);
    return {
      mode: row.dataset.mode,
      name: $('.name', row).value,
      start: segs[0] ? segs[0].start : '',    // 保留旧字段，旧存档也能读
      end: segs[0] ? segs[0].end : '',
      segs: segs,
      hours: $('.h-val', row).value,
      deduct: $('.deduct', row).value,
      rate: $('.rate', row).value,
      note: $('.notev', row).value
    };
  }
  function serialize(){
    return $$('.row', listEl).map(readRow);
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(serialize())); }catch(e){}
  }
  function load(){
    try{
      var raw = localStorage.getItem(KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }

  /* ---------- 行 ---------- */
  function applyMode(row){
    var mode = row.dataset.mode === 'hours' ? 'hours' : 'range';
    row.dataset.mode = mode;
    $$('.seg-btn', row).forEach(function(b){
      var on = b.dataset.mode === mode;
      b.classList.toggle('on', on);
      b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('.range-only', row).hidden = mode !== 'range';
    $('.hours-only', row).hidden = mode !== 'hours';
  }

  function addRow(data, afterRow){
    var row = tpl.content.firstElementChild.cloneNode(true);
    if(data){
      row.dataset.mode = data.mode === 'hours' ? 'hours' : 'range';
      $('.name', row).value = data.name || '';
      var segs = (data.segs && data.segs.length)
        ? data.segs
        : [{ start: data.start || '', end: data.end || '' }];
      var firstSeg = $('.seg-row', row);
      $('.t-start', firstSeg).value = (segs[0] && segs[0].start) || '';
      $('.t-end', firstSeg).value = (segs[0] && segs[0].end) || '';
      for(var si = 1; si < segs.length; si++) addSegRow(row, segs[si]);
      $('.h-val', row).value = data.hours || '';
      $('.deduct', row).value = data.deduct || '';
      $('.rate', row).value = data.rate || '';
      $('.notev', row).value = data.note || '';
    }
    syncSegRows(row);
    applyMode(row);
    if(afterRow && afterRow.parentNode === listEl){
      listEl.insertBefore(row, afterRow.nextSibling);   // 复制出来的行紧跟在原行后面
    }else{
      listEl.appendChild(row);
    }
    return row;
  }

  function resetRow(row){
    ['name','h-val','deduct','rate','notev'].forEach(function(c){ $('.' + c, row).value = ''; });
    resetSegments(row);
    row.dataset.mode = 'range';
    applyMode(row);
  }

  /* ---------- 事件 ---------- */
  listEl.addEventListener('input', function(e){
    if(e.target.classList.contains('inp')) refresh();
  });

  /* 数字框聚焦时全选，直接输入就能覆盖旧值 */
  listEl.addEventListener('focusin', function(e){
    var t = e.target;
    if(t.classList && (t.classList.contains('rate') || t.classList.contains('deduct') || t.classList.contains('h-val'))){
      setTimeout(function(){ try{ t.select(); }catch(err){} }, 0);
    }
  });

  /* 昵称框里按 Enter = 添加下一位 */
  listEl.addEventListener('keydown', function(e){
    if(e.key === 'Enter' && e.target.classList && e.target.classList.contains('name')){
      e.preventDefault();
      addRowFromUI();
    }
  });

  listEl.addEventListener('click', function(e){
    var row = e.target.closest ? e.target.closest('.row') : null;
    if(!row) return;

    var seg = e.target.closest('.seg-btn');
    if(seg){ row.dataset.mode = seg.dataset.mode; applyMode(row); refresh(); return; }

    var mini = e.target.closest('.mini');
    if(mini){
      var inp = $('.h-val', row);
      var step = mini.classList.contains('plus') ? 0.5 : -0.5;
      var v = Math.max(0, round2(num(inp.value) + step));
      inp.value = v > 0 ? trimNum(v) : '';
      refresh();
      return;
    }

    var segAdd = e.target.closest('.seg-add');
    if(segAdd){
      var newSeg = addSegRow(row);
      if(newSeg){
        refresh();
        var startInput = $('.t-start', newSeg);
        if(startInput) startInput.focus();
      }
      return;
    }

    var segX = e.target.closest('.seg-x');
    if(segX){
      var segRowEl = segX.closest('.seg-row');
      if(segRowEl && $$('.seg-row', row).length > 1){
        segRowEl.remove();
        syncSegRows(row);
        refresh();
      }
      return;
    }

    if(e.target.closest('.dup')){
      var data = readRow(row);
      data.name = '';                         // 复制设置，但昵称留空，免得重名
      var copy = addRow(data, row);
      refresh();
      $('.name', copy).focus();
      if(copy.scrollIntoView && copy.getBoundingClientRect().bottom > window.innerHeight){
        copy.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      }
      return;
    }

    if(e.target.closest('.del')){
      if($$('.row', listEl).length <= 1){
        resetRow(row);                        // 最后一行只清内容，保留结构
      }else{
        row.style.opacity = '0';
        row.style.transform = 'scale(.97)';
        setTimeout(function(){ row.remove(); refresh(); }, 150);
        return;
      }
      refresh();
    }
  });

  /* ---------- 添加 ---------- */
  function addRowFromUI(){
    var rows = $$('.row', listEl);
    var last = rows[rows.length - 1];
    var row = addRow();
    if(last && last !== row){                 // 沿用上一行的单价，少填几次
      $('.rate', row).value = $('.rate', last).value;
    }
    refresh();
    $('.name', row).focus();
    if(row.scrollIntoView) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
  document.getElementById('addBtn').addEventListener('click', addRowFromUI);

  /* ---------- 复制账单 ---------- */
  function buildBill(){
    var rows = $$('.row', listEl);
    var lines = ['🌿 陪玩计费单', '· · · · · · · · · · · ·'];
    var totalMin = 0, totalA = 0, totalD = 0, n = 0;

    rows.forEach(function(row){
      var r = calc(row);
      var name = $('.name', row).value.trim();
      var note = $('.notev', row).value.trim();
      if(!name && !r.mins) return;

      n++;
      var detail = '';
      if(r.mode !== 'hours'){                 // 时长模式下 fmtMin 已经把时长说全了，不再重复
        var parts = [];
        readSegments(row).forEach(function(sg){
          if(!sg.start && !sg.end) return;
          var a = toMin(sg.start), b = toMin(sg.end);
          var sc = a !== null && b !== null && b < a;
          parts.push((sg.start || '--:--') + '-' + (sg.end || '--:--') + (sc ? '（跨天）' : ''));
        });
        detail = parts.length ? parts.join('、') : '--:--';
      }

      var line = n + '. ' + (name || '未命名') + '　' + (detail ? detail + '　' : '') + fmtMin(r.netMin);
      if(r.deduct > 0) line += '　赔付 −' + fmtMinOnly(r.deduct);
      if(r.rate > 0) line += '　单价 ¥' + trimNum(r.rate) + '/时';
      line += '　→ ¥' + group(r.amount);
      lines.push(line);
      if(note) lines.push('   备注：' + note);

      totalMin += r.netMin;
      totalD += r.deduct;
      totalA = round2(totalA + r.amount);
    });

    if(!n) return '';
    lines.push('· · · · · · · · · · · ·');
    lines.push('共 ' + n + ' 位　总时长 ' + fmtMin(totalMin));
    if(totalD > 0) lines.push('其中已赔付 ' + fmtMinOnly(totalD) + '，已从时长和金额中扣除');
    lines.push('合计金额 ¥' + group(totalA));
    lines.push('—— 谢谢陪伴 ♡ ——');
    return lines.join('\n');
  }

  function copyText(text){
    if(navigator.clipboard && window.isSecureContext){
      return navigator.clipboard.writeText(text).then(function(){ return true; }, function(){ return legacyCopy(text); });
    }
    return Promise.resolve(legacyCopy(text));
  }
  function legacyCopy(text){
    try{
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;left:0;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand('copy');
      ta.remove();
      return ok;
    }catch(e){ return false; }
  }

  document.getElementById('copyBtn').addEventListener('click', function(){
    var bill = buildBill();
    if(!bill){ toast('还没有可复制的记录'); return; }
    copyText(bill).then(function(ok){
      toast(ok ? '账单已复制 ♡ 去粘贴吧' : '复制失败，请手动选中复制');
    });
  });

  /* ---------- 清空（点两次确认，并支持撤销） ---------- */
  var clearBtn = document.getElementById('clearBtn');
  var armed = false, armTimer = null, undoSnapshot = null;
  function disarm(){
    armed = false;
    clearBtn.classList.remove('armed');
    clearBtn.lastChild.textContent = ' 清空';
  }
  clearBtn.addEventListener('click', function(){
    if(!armed){
      armed = true;
      clearBtn.classList.add('armed');
      clearBtn.lastChild.textContent = ' 再点一次清空';
      clearTimeout(armTimer);
      armTimer = setTimeout(disarm, 3200);
      return;
    }
    clearTimeout(armTimer);
    disarm();

    undoSnapshot = serialize();               // 清空前留一份快照，5 秒内可撤销
    listEl.textContent = '';
    addRow();
    refresh();
    toast('已清空，重新开始', '撤销', function(){
      if(!undoSnapshot) return;
      var snap = undoSnapshot;
      undoSnapshot = null;
      listEl.textContent = '';
      snap.forEach(function(d){ addRow(d); });
      if(!$$('.row', listEl).length) addRow();
      refresh();
      toast('已经恢复啦 ♡');
    });
  });

  /* ---------- 轻提示 ---------- */
  var toastEl = document.getElementById('toast');
  var toastMsg = document.getElementById('toastMsg');
  var toastAct = document.getElementById('toastAct');
  var toastTimer = null;

  function toast(msg, actionLabel, actionFn){
    toastMsg.textContent = msg;
    if(actionLabel){
      toastAct.textContent = actionLabel;
      toastAct.hidden = false;
      toastAct.onclick = function(){
        clearTimeout(toastTimer);
        toastEl.classList.remove('show');
        toastAct.hidden = true;
        toastAct.onclick = null;
        if(actionFn) actionFn();
      };
    }else{
      toastAct.hidden = true;
      toastAct.onclick = null;
    }
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){
      toastEl.classList.remove('show');
      toastAct.hidden = true;
      toastAct.onclick = null;
    }, actionLabel ? 5200 : 2000);
  }

  /* ---------- 启动 ---------- */
  function showFatal(err){
    var p = document.createElement('p');
    p.className = 'fatal';
    p.textContent = '出错了：' + (err && err.message ? err.message : err) + ' —— 把这句话截图反馈即可定位问题。';
    var main = document.querySelector('main');
    (main || document.body).appendChild(p);
  }

  function boot(){
    var saved = load();
    if(saved && saved.length){
      saved.forEach(function(d){ addRow(d); });
    }else{
      addRow();
    }
    refresh();
  }

  try{
    boot();
  }catch(err){
    showFatal(err);
  }
  window.__ok = true;      // 告诉自检脚本：主脚本跑起来了
})();
</script>
</body>
</html>
